<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pregister">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon-32.png"/>

  <title>PaaayIT Register</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Auto-relaunch as a bare popup (app-mode equivalent) when opened in a normal browser tab.
    // Skipped when already in standalone/fullscreen PWA mode or in the popup itself.
    (function () {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         window.matchMedia('(display-mode: fullscreen)').matches ||
                         window.navigator.standalone === true;
      var isPopup = (window.opener !== null && window.opener !== window);
      if (!isStandalone && !isPopup && !sessionStorage.getItem('_app_popup')) {
        sessionStorage.setItem('_app_popup', '1');
        var w = screen.availWidth;
        var h = screen.availHeight;
        var features = 'popup,left=0,top=0,width=' + w + ',height=' + h;
        window.open(location.href, '_blank', features);
        window.close();
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
